[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
# Exact float parsing: forest thresholds and leaf probabilities must match sklearn bit for bit.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }

[target."cfg(windows)".dependencies]
ferrisetw = "1.2.0"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_EventLog", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.191"
