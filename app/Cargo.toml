[package]
name = "runtime-monitor"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
ctrlc = "3"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1"
sysinfo = "0.33"
